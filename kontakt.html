title: Beata Stróżna - Gabinet Masażu Leczniczego
---

<main class="pt-20 flex-grow">
    {% include contact.html %}
    {% include map.html %}
</main>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyc_JYHkB7o1MPV3yD1-6gynHheu4VQRZ1boPlU-uhn8HdtbxjLZyzIPZmQ7eoB4-e_vw/exec';
    const form = document.getElementById('contactForm');
    const btn = document.getElementById('submitBtn');
    const checkbox = document.getElementById('consent');
    const consentError = document.getElementById('consentError');

    function toggleButton() {
        if (checkbox.checked) {
            btn.disabled = false;
            consentError.classList.add('hidden');
        } else {
            btn.disabled = true;
            consentError.classList.remove('hidden');
        }
    }

    btn.disabled = true;
    checkbox.checked = false;

    checkbox.addEventListener('change', toggleButton);

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        if (!checkbox.checked) {
            consentError.classList.remove('hidden');
            return;
        }

        btn.disabled = true;
        btn.innerText = "Wysyłanie...";

        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
            .then(response => {
                alert('Dziękuję za wiadomość! Odpowiem najszybciej jak to możliwe.');
                form.reset();
                toggleButton();
            })
            .catch(error => {
                alert('Wystąpił błąd. Spróbuj ponownie później.');
            })
            .finally(() => {
                toggleButton();
                btn.innerText = "Wyślij zapytanie";
            });
    });
</script>

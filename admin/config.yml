backend:
  name: github
  repo: sebhal92/gabinet-beata-test
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "cennik"
    label: "Cennik usług"
    files:
      - file: "_data/cennik.yml"
        label: "Edycja Cennika"
        name: "cennik_uslug"
        fields:
          - label: "Kategorie i zabiegi"
            name: "kategorie"
            type: "list"
            fields:
              - label: "Nazwa kategorii"
                name: "nazwa"
                type: "text"
                required: false
              - label: "Pozycje (Zabiegi)"
                name: "pozycje"
                type: "list"
                required: false
                fields:
                  - label: "Nazwa zabiegu"
                    name: "zabieg"
                    type: "text"
                  - label: "Czas trwania"
                    name: "czas"
                    type: "text"
                  - label: "Cena (np. 150 zł lub zostaw puste, by był przycisk Zapytaj)"
                    name: "cena"
                    type: "text"
                    required: false

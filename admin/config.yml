backend:
  name: github
  repo: sebhal92/gabinet-beata-test
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "cennik"
    label: "Cennik usług"
    files:
      - file: "_data/cennik.yml"
        label: "Edycja Cennika"
        name: "cennik_uslug"
        fields:
          - label: "Kategorie"
            name: "kategorie"
            type: "list"
            field:
              label: "Kategoria"
              name: "kategoria_item"
              type: "object"
              fields:
                - label: "Nazwa kategorii"
                  name: "nazwa"
                  type: "text"
                - label: "Zabiegi"
                  name: "pozycje"
                  type: "list"
                  field:
                    label: "Zabieg"
                    name: "zabieg_item"
                    type: "object"
                    fields:
                      - label: "Nazwa zabiegu"
                        name: "zabieg"
                        type: "text"
                      - label: "Czas trwania"
                        name: "czas"
                        type: "text"
                      - label: "Cena"
                        name: "cena"
                        type: "text"
                        required: false

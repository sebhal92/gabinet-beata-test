backend:
  name: github
  repo: sebhal92/gabinet-beata-test
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "cennik"
    label: "Cennik usług"
    files:
      - file: "_data/cennik.yml"
        label: "Edycja Cennika"
        name: "cennik_uslug"
        fields:
          - label: "Kategorie"
            name: "kategorie"
            type: "list"
            fields:
              - label: "Nazwa kategorii"
                name: "nazwa"
                type: "text"
              - label: "Pozycje"
                name: "pozycje"
                type: "list"
                fields:
                  - label: "Zabieg"
                    name: "zabieg"
                    type: "text"
                  - label: "Czas"
                    name: "czas"
                    type: "text"
                  - label: "Cena"
                    name: "cena"
                    type: "text"

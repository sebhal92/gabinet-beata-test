backend:
  name: github
  repo: sebhal92/gabinet-beata-test
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "cennik"
    label: "Cennik usług"
    files:
      - file: "_data/cennik.yml"
        label: "Edycja Cennika"
        name: "cennik_uslug"
        fields:
          - label: "Struktura cennika YAML"
            name: "body"
            type: "text"
            hint: "Tutaj znajduje się cała struktura kategorii i pozycji cennika w formacie YAML."

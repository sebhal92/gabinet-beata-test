<div id="lightbox" class="hidden fixed inset-0 z-[100] bg-black/95 backdrop-blur-sm flex items-center justify-center p-4 select-none">
    <button onclick="closeLightbox()" class="absolute top-6 right-6 text-clinical-white hover:text-primary-fixed-dim transition-colors z-50">
        <span class="material-symbols-outlined text-4xl">close</span>
    </button>
    
    <button onclick="prevImage()" class="absolute left-4 top-1/2 -translate-y-1/2 text-clinical-white hover:text-primary-fixed-dim transition-colors bg-black/30 p-2 rounded-full backdrop-blur-sm">
        <span class="material-symbols-outlined text-4xl">chevron_left</span>
    </button>

    <div class="max-w-5xl max-h-[90vh] flex items-center justify-center">
        <img id="lightboxImg" class="max-w-full max-h-[90vh] object-contain rounded shadow-2xl" src="" alt=""/>
    </div>

    <button onclick="nextImage()" class="absolute right-4 top-1/2 -translate-y-1/2 text-clinical-white hover:text-primary-fixed-dim transition-colors bg-black/30 p-2 rounded-full backdrop-blur-sm">
        <span class="material-symbols-outlined text-4xl">chevron_right</span>
    </button>
</div>

<script>
    let currentImgIndex = 0;
    const galleryImages = [
        "/assets/images/1.jpg",
        "/assets/images/2.jpg",
        "/assets/images/3.jpg",
        "/assets/images/4.jpg",
        "/assets/images/5.jpg",
        "/assets/images/6.jpg",
        "/assets/images/14.jpg",
        "/assets/images/15.jpg",
        "/assets/images/16.jpg"
    ];

    function openLightbox(index) {
        currentImgIndex = index;
        updateLightbox();
        document.getElementById('lightbox').classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
    }

    function updateLightbox() {
        document.getElementById('lightboxImg').src = galleryImages[currentImgIndex];
    }

    function nextItem() {
        currentImgIndex = (currentImgIndex + 1) % galleryImages.length;
        updateLightbox();
    }

    function nextImage() {
        nextItem();
    }

    function prevImage() {
        currentImgIndex = (currentImgIndex - 1 + galleryImages.length) % galleryImages.length;
        updateLightbox();
    }

    window.addEventListener('keydown', (e) => {
        const lightbox = document.getElementById('lightbox');
        if (!lightbox.classList.contains('hidden')) {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        }
    });
</script>
